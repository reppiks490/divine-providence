name: onchain-proof-clock-tests

on:
  push:
    paths:
      - "src/divine_providence/onchain_research/**"
      - "tests/test_onchain_research.py"
      - "docs/research/ONCHAIN_PROOF_CLOCK.md"
      - "docs/research/PROOF_TO_OUTCOME_NETWORK.md"
      - ".github/workflows/onchain-proof-clock-tests.yml"
  pull_request:
    paths:
      - "src/divine_providence/onchain_research/**"
      - "tests/test_onchain_research.py"
      - "docs/research/ONCHAIN_PROOF_CLOCK.md"
      - "docs/research/PROOF_TO_OUTCOME_NETWORK.md"
      - ".github/workflows/onchain-proof-clock-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onchain-proof-clock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-clock:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile proof clock
        run: python -m compileall -q src/divine_providence/onchain_research tests/test_onchain_research.py
      - name: Test proof clock
        run: python -m pytest -q tests/test_onchain_research.py

  repository-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full hub
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Root hub tests
        run: python -m pytest -q tests
      - name: Full twelve-system validation
        run: python -m divine_providence.validate --workers 2
