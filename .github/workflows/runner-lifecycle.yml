name: Runner lifecycle

on:
  pull_request:
    paths:
      - "src/divine_providence/runner.py"
      - "tests/test_runner_lifecycle.py"
      - ".github/workflows/runner-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "src/divine_providence/runner.py"
      - "tests/test_runner_lifecycle.py"
      - ".github/workflows/runner-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_runner_lifecycle.py
        env:
          PYTHONPATH: src
