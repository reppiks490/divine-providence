name: subsystem-evolution-tests

on:
  push:
    paths:
      - "systems/aion/**"
      - "systems/argus/**"
      - "systems/athena/**"
      - ".github/workflows/subsystem-evolution-tests.yml"
  pull_request:
    paths:
      - "systems/aion/**"
      - "systems/argus/**"
      - "systems/athena/**"
      - ".github/workflows/subsystem-evolution-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subsystem-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-subsystems:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        system: [aion, argus, athena]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: systems/${{ matrix.system }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: python -m pytest -q

  intelligence-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hub
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile hub and evolved subsystems
        run: python -m compileall -q src systems/aion systems/argus systems/athena
      - name: Contract drift diagnostic
        run: python -m divine_providence.drivers.nexus_contract_drift
      - name: Causal intelligence-fabric connection
        run: python -m divine_providence.drivers.intelligence_fabric
      - name: Hub tests
        run: python -m pytest -q tests
