name: NEXUS tests

on:
  push:
    branches: [main]
    paths:
      - "systems/nexus/**"
      - ".github/workflows/nexus-tests.yml"
  pull_request:
    paths:
      - "systems/nexus/**"
      - ".github/workflows/nexus-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: systems/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: systems/nexus/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run NEXUS tests
        run: python -m pytest
