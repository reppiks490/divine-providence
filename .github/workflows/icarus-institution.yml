name: ICARUS Research Institution

"on":
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/institution/**'
      - 'systems/daedalus/src/**'
      - 'systems/oracle/src/**'
      - 'tests/test_institution*'
      - 'pyproject.toml'
      - '.github/workflows/icarus-institution.yml'
  pull_request:
    paths:
      - 'scripts/institution/**'
      - 'tests/test_institution*'
      - '.github/workflows/icarus-institution.yml'

permissions:
  contents: read

concurrency:
  group: icarus-institution-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m pytest tests

  research:
    needs: [contract-tests]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize fresh incomplete cycle
        run: python3 -m scripts.institution.collect --initialize
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install existing research dependencies
        id: install
        run: python -m pip install -e .
      - name: Discover owned index corpus revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: reppiks490/csv-data-multi-chart-type
          path: _institution_sources/indexes
          persist-credentials: false
      - name: Discover owned multi-chart corpus revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: reppiks490/multi-level-csv
          path: _institution_sources/multi
          persist-credentials: false
      - name: Research unseen contexts and official announcements
        run: >-
          python -m scripts.institution.collect
          --source-root _institution_sources/indexes
          --source-root _institution_sources/multi
      - name: Finalize incomplete or completed receipt
        if: always()
        run: python3 -m scripts.institution.collect --finalize
      - name: Build graph, tournament, manifests and brief
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: python -m scripts.institution.report
      - name: Add research brief to run summary
        if: always()
        run: test ! -f _institution/brief.md || cat _institution/brief.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain current evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icarus-institution-${{ github.run_id }}-${{ github.run_attempt }}
          path: _institution/
          retention-days: 30
          if-no-files-found: error
      - name: Require complete evidence
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: python -m scripts.institution.report --enforce

  publish:
    needs: [contract-tests, research]
    if: >-
      ${{ always() && needs.contract-tests.result == 'success' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Download this run's evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: icarus-institution-${{ github.run_id }}-${{ github.run_attempt }}
          path: _institution_input
      - name: Publish trusted data and preserve memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.institution.publish
      - name: Add published brief
        if: always()
        run: test ! -f _institution_published/brief.md || cat _institution_published/brief.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain published intelligence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icarus-institution-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: _institution_published/
          retention-days: 30
