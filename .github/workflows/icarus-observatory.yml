name: ICARUS Observatory

"on":
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'systems/**'
      - 'tests/**'
      - 'scripts/observatory/**'
      - 'pyproject.toml'
      - '.github/workflows/icarus-observatory.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'systems/**'
      - 'tests/**'
      - 'scripts/observatory/**'
      - 'pyproject.toml'
      - '.github/workflows/icarus-observatory.yml'

permissions:
  contents: read

concurrency:
  group: icarus-observatory-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  windows-collector:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout observed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install collector test runner
        run: python -m pip install pytest
      - name: Verify Windows collector process output and cleanup
        run: python -m pytest tests/test_observatory_collect.py -q

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout observed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize fresh receipt before dependency setup
        id: initialize
        run: python3 -m scripts.observatory.collect --output _observatory --initialize
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install existing hub dependencies
        id: install
        run: python -m pip install -e .
      - name: Collect hub and twelve-system evidence
        if: ${{ steps.install.outcome == 'success' }}
        run: python -m scripts.observatory.collect --output _observatory --hub-timeout 300
      - name: Finalize interrupted or completed collection
        if: always()
        run: python3 -m scripts.observatory.collect --output _observatory --finalize
      - name: Build proof atlas
        if: always()
        run: python3 -m scripts.observatory.report --input _observatory --output _observatory
      - name: Add assessment to run summary
        if: always()
        run: cat _observatory/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icarus-observatory-${{ github.run_id }}-${{ github.run_attempt }}
          path: _observatory/
          retention-days: 30
          if-no-files-found: error
      - name: Require complete passing evidence
        if: always()
        run: python3 -m scripts.observatory.report --input _observatory --output _observatory --enforce

  publish:
    needs: [collect]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          (github.event_name == 'push' || github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - name: Checkout trusted observed main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up report interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Download current run evidence
        continue-on-error: true # Missing evidence is published as incomplete, never healthy.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: icarus-observatory-${{ github.run_id }}-${{ github.run_attempt }}
          path: _observatory_input
      - name: Publish durable history and current incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVATORY_COLLECT_RESULT: ${{ needs.collect.result }}
        run: python -m scripts.observatory.publish --input _observatory_input --output _observatory_published
      - name: Add history comparison to run summary
        if: always()
        run: cat _observatory_published/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reconciled dashboard and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icarus-observatory-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: _observatory_published/
          retention-days: 30
          if-no-files-found: error
