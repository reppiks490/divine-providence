[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-adaptive-market-fabric"
version = "0.3.0"
description = "CSV-first causal market data fabric, deterministic replay engine, adaptive synthetic ticker factory, and cross-asset topology layer for the Icarus intelligence stack."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
