[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus-aion"
version = "0.1.0"
description = "A replayable market memory for the Icarus research stack"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aion = "aion.cli:main"

[tool.setuptools.packages.find]
include = ["aion*"]

[tool.setuptools.package-data]
aion = ["cockpit.html"]
